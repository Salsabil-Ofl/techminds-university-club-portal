<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Upcoming and past club events">
  <title>Events | TechMinds Club</title>
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Main stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme-frost.css">
  <link rel="stylesheet" href="css/lotus.css">
</head>
<body>
  <div id="loader"><div class="loader-ring"></div></div>
  <div id="scroll-progress"></div>

  <!-- Header & navigation (built by js/main.js) -->
  <header id="site-header"></header>

  <main>
  <!-- Page header -->
  <section class="page-header">
    <div class="container">
      <h1 class="reveal">Club <span class='text-gradient'>Events</span></h1>
      <p class="reveal">Workshops, hackathons, seminars and more. Find your next event, its date and location.</p>
      <div class="breadcrumb reveal"><a href="home.html">Home</a> / <span>Events</span></div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="toolbar reveal">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="event-search" placeholder="Search by title, location or category...">
        </div>
        <div class="filters" id="status-filters">
          <button class="filter-btn active" data-filter="upcoming">Upcoming</button>
          <button class="filter-btn" data-filter="past">Past</button>
          <button class="filter-btn" data-filter="all">All</button>
        </div>
      </div>
      <div class="filters reveal" id="category-filters" style="margin-bottom:25px">
        <button class="filter-btn active" data-filter="All">All Categories</button>
        <button class="filter-btn" data-filter="Workshop">Workshops</button>
        <button class="filter-btn" data-filter="Competition">Competitions</button>
        <button class="filter-btn" data-filter="Seminar">Seminars</button>
        <button class="filter-btn" data-filter="Networking">Networking</button>
      </div>
      <p class="results-count" id="results-count"></p>
      <div class="grid-3" id="events-grid"></div>
      <div class="no-results" id="no-results"><i class="fa-solid fa-calendar-xmark"></i><h3>No events found</h3><p>Try another search word or filter.</p></div>
    </div>
  </section>

  </main>

  <!-- Footer (built by js/main.js) -->
  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/frost.js"></script>
  <script src="js/lotus.js" defer></script>
</body>
</html>
